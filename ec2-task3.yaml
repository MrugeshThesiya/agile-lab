AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Task 3 - Deploy an EC2 Instance with Public IP,
  Security Group and an additional EBS Data Volume.

Parameters:
  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t3.micro

Mappings:
  RegionMap:
    ap-south-1:
      AMI: ami-0f58b397bc5c1f2e8

Resources:

  ##########################################################
  # Security Group (Equivalent of Azure NSG)
  ##########################################################

  MySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: MySecurityGroup

  ##########################################################
  # EC2 Instance
  ##########################################################

  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !FindInMap [RegionMap, !Ref AWS::Region, AMI]
      InstanceType: !Ref InstanceType
      SecurityGroupIds:
        - !Ref MySecurityGroup
      Tags:
        - Key: Name
          Value: Task3-VM

  ##########################################################
  # Additional Managed Data Disk (EBS Volume)
  ##########################################################

  MyDataDisk:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !GetAtt MyEC2Instance.AvailabilityZone
      Size: 10
      VolumeType: gp3
      Tags:
        - Key: Name
          Value: MyDataDisk

  ##########################################################
  # Attach EBS Volume to EC2
  ##########################################################

  MyVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref MyEC2Instance
      VolumeId: !Ref MyDataDisk

Outputs:

  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref MyEC2Instance

  PublicIPAddress:
    Description: Public IPv4 Address
    Value: !GetAtt MyEC2Instance.PublicIp

  PrivateIPAddress:
    Description: Private IPv4 Address
    Value: !GetAtt MyEC2Instance.PrivateIp

  SecurityGroupId:
    Description: Security Group ID
    Value: !Ref MySecurityGroup

  DataDiskId:
    Description: EBS Volume ID
    Value: !Ref MyDataDisk

  DataDiskSize:
    Description: EBS Volume Size (GB)
    Value: "10"

  AvailabilityZone:
    Description: Availability Zone
    Value: !GetAtt MyEC2Instance.AvailabilityZone
