name: Go CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Download Dependencies
        working-directory: github-actions-workflow
        run: go mod download 

      - name: Run Go tests
        working-directory: github-actions-workflow
        run: go test ./...
