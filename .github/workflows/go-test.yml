name: Go CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Download dependencies
        run: go mod download
        working-directory: prac-5

      - name: Run tests
        run: go test ./...
        working-directory: prac-5
